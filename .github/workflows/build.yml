name: NexaWrt AX9000 initramfs build

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Build flavor (official is the default; nss is experimental)
        required: true
        default: official
        type: choice
        options: [official, nss]
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'README.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'Makefile'
      - 'docs/**'
      - 'tests/**'
      - 'configs/**'
      - 'files/**'
      - 'files-nss/**'
      - 'manifests/**'
      - 'patches/**'
      - 'scripts/**'
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: nexawrt-ax9000-build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'official' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NEXAWRT_FLAVOR: ${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'official' }}
      CLEAN_BUILD: '1'
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run repository policy checks
        run: ./tests/test_static.sh

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools python3-packaging rsync swig unzip zlib1g-dev \
            file wget libelf-dev shellcheck subversion time xsltproc zstd
      - name: Lint shell safety policies
        run: shellcheck -S warning scripts/*.sh tests/*.sh files/sbin/* files-nss/etc/uci-defaults/* files/etc/uci-defaults/*

      - name: Cache public source downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .work/openwrt/dl
            .work/openwrt-nss/dl
          key: openwrt-dl-${{ env.NEXAWRT_FLAVOR }}-${{ hashFiles('manifests/*.lock', 'configs/**', 'patches/**') }}
          restore-keys: |
            openwrt-dl-${{ env.NEXAWRT_FLAVOR }}-

      - name: Build and stage artifact
        env:
          BUILD_LOG: ${{ github.workspace }}/build-${{ env.NEXAWRT_FLAVOR }}.log
        run: ./scripts/build.sh

      - name: Upload official firmware and evidence
        if: env.NEXAWRT_FLAVOR == 'official'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexawrt-ax9000-initramfs-official-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload experimental NSS firmware and evidence
        if: env.NEXAWRT_FLAVOR == 'nss'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexawrt-ax9000-initramfs-nss-${{ github.sha }}
          path: dist-nss/
          if-no-files-found: error
          retention-days: 30
