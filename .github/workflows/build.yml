name: NexaWrt AX9000 initramfs build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'README.md'
      - 'Makefile'
      - 'docs/**'
      - 'tests/**'
      - 'configs/**'
      - 'files/**'
      - 'manifests/**'
      - 'patches/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: nexawrt-ax9000-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run repository safety checks
        run: ./tests/test_static.sh

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools python3-packaging rsync swig unzip zlib1g-dev \
            file wget libelf-dev subversion time xsltproc zstd

      - name: Cache downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .work/openwrt/dl
          key: openwrt-dl-${{ hashFiles('manifests/upstream.lock', 'manifests/feeds.lock', 'configs/**') }}
          restore-keys: |
            openwrt-dl-

      - name: Build and stage release files
        run: ./scripts/build.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexawrt-ax9000-initramfs-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
