name: NexaWrt GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'components/**'
      - 'manifests/community-feeds.lock'
      - 'manifests/package-repository.lock'
      - 'manifests/package-repository-public.pem'
      - 'scripts/stage-package-repository.py'
      - 'tests/test_package_repository.py'
      - 'tests/test_pages_ui.js'
      - 'tests/test_package_catalog.py'
      - 'tests/test_package_purpose_zh.py'
      - 'tests/test_pages_policy.sh'
      - 'tests/test_component_catalog_staging.py'
      - 'devices/**'
      - 'scripts/device_metadata.py'
      - 'scripts/generate-package-catalog.py'
      - 'scripts/package_purpose_zh.py'
      - 'scripts/generate-pages-data.py'
      - 'scripts/component_package_policy.py'
      - 'scripts/resolve-components.py'
      - 'scripts/validate-component-catalogs.py'
      - 'scripts/verify-pages-releases.py'
      - 'scripts/verify-vm-esxi-evidence.py'
      - 'schemas/vm-esxi-evidence.schema.json'
      - 'evidence/vm-esxi/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['NexaWrt AX9000 reproducible RAM-test release', 'NexaWrt x86_64 VM release', 'Promote ESXi-accepted VM RC', 'NexaWrt signed APK package repository']
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.repository == 'tifycloud/NexaWrt' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout trusted site source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Pin attestation verifier executable
        run: |
          test -x /usr/bin/gh
          test ! -L /usr/bin/gh
          echo 'NEXAWRT_ATTESTATION_VERIFIER=/usr/bin/gh' >> "$GITHUB_ENV"
          echo "NEXAWRT_ATTESTATION_VERIFIER_SHA256=$(sha256sum /usr/bin/gh | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Generate attestation-gated release index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir .pages-index
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > .pages-index/releases.json
          python3 scripts/verify-pages-releases.py \
            --input .pages-index/releases.json \
            --output .pages-index/release-proofs.json \
            --trusted-main HEAD
          python3 scripts/generate-pages-data.py \
            --input .pages-index/releases.json \
            --proofs .pages-index/release-proofs.json \
            --output site/releases.json
          python3 -m json.tool .pages-index/release-proofs.json >/dev/null
          python3 -m json.tool site/releases.json >/dev/null
          if find site \( -type l -o -type f -links +1 \) -print -quit | grep -q .; then
            echo 'The Pages artifact must not contain symbolic or hard links.' >&2
            exit 1
          fi
      - name: Validate and stage component catalogs for Pages
        run: |
          set -euo pipefail
          python3 scripts/validate-component-catalogs.py \
            --components-root components \
            --site-root site/components
          if find site/components \( -type l -o -type f -links +1 \) -print -quit | grep -q .; then
            echo 'The staged component catalogs must not contain symbolic or hard links.' >&2
            exit 1
          fi
      - name: Download, verify, and stage the signed APK repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/lock-file-policy.sh
          nexawrt_validate_lock_file manifests/package-repository.lock package-repository
          source manifests/package-repository.lock
          release_json=.pages-index/package-repository-release.json
          release_error=.pages-index/package-repository-release.error
          if ! gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$NEXAWRT_REPOSITORY_RELEASE_TAG" \
              > "$release_json" 2> "$release_error"; then
            if grep -Fq 'HTTP 404' "$release_error"; then
              echo "Signed APK repository $NEXAWRT_REPOSITORY_RELEASE_TAG is not published; refusing to deploy Pages without the locked repository." >&2
              rm -f "$release_json" "$release_error"
              exit 1
            fi
            cat "$release_error" >&2
            exit 1
          fi
          rm -f "$release_error"
          read -r asset_id asset_digest < <(python3 - "$release_json" "$NEXAWRT_REPOSITORY_ASSET" <<'PYDATA'
          import json
          import re
          import sys

          release = json.load(open(sys.argv[1], encoding='utf-8'))
          if release.get('draft') is not False:
              raise SystemExit('package repository release must be published')
          assets = [item for item in release.get('assets', []) if item.get('name') == sys.argv[2]]
          if len(assets) != 1:
              raise SystemExit('package repository release must contain exactly one locked archive')
          asset = assets[0]
          digest = asset.get('digest')
          if not isinstance(asset.get('id'), int) or not isinstance(digest, str) or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('package repository release asset lacks a valid GitHub digest')
          print(asset['id'], digest.removeprefix('sha256:'))
          PYDATA
          )
          mkdir -p .pages-index/package-repository
          archive=.pages-index/package-repository/$NEXAWRT_REPOSITORY_ASSET
          gh api \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$archive"
          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$archive_sha" == "$asset_digest" ]] || {
            echo 'Downloaded package repository archive differs from the GitHub asset digest.' >&2
            exit 1
          }
          python3 scripts/stage-package-repository.py stage-pages \
            --archive "$archive" \
            --archive-sha256 "$archive_sha" \
            --github-asset-json "$release_json" \
            --site-dir site
          if find site/packages \( -type l -o -type f -links +1 \) -print -quit | grep -q .; then
            echo 'The staged APK repository must not contain symbolic or hard links.' >&2
            exit 1
          fi
      - name: Test Pages UI and policy
        run: |
          set -euo pipefail
          node tests/test_pages_ui.js
          python3 tests/test_package_catalog.py
          python3 tests/test_package_purpose_zh.py
          python3 tests/test_component_catalog_staging.py
          bash tests/test_pages_policy.sh
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
