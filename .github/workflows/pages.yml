name: NexaWrt GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'components/**'
      - 'tests/test_pages_ui.js'
      - 'tests/test_pages_policy.sh'
      - 'devices/**'
      - 'scripts/device_metadata.py'
      - 'scripts/generate-pages-data.py'
      - 'scripts/verify-pages-releases.py'
      - 'scripts/verify-vm-esxi-evidence.py'
      - 'schemas/vm-esxi-evidence.schema.json'
      - 'evidence/vm-esxi/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['NexaWrt AX9000 reproducible RAM-test release', 'NexaWrt x86_64 VM release', 'Promote ESXi-accepted VM RC']
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.repository == 'tifycloud/NexaWrt' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout trusted site source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Pin attestation verifier executable
        run: |
          test -x /usr/bin/gh
          test ! -L /usr/bin/gh
          echo 'NEXAWRT_ATTESTATION_VERIFIER=/usr/bin/gh' >> "$GITHUB_ENV"
          echo "NEXAWRT_ATTESTATION_VERIFIER_SHA256=$(sha256sum /usr/bin/gh | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Generate attestation-gated release index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir .pages-index
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > .pages-index/releases.json
          python3 scripts/verify-pages-releases.py \
            --input .pages-index/releases.json \
            --output .pages-index/release-proofs.json \
            --trusted-main HEAD
          python3 scripts/generate-pages-data.py \
            --input .pages-index/releases.json \
            --proofs .pages-index/release-proofs.json \
            --output site/releases.json
          python3 -m json.tool .pages-index/release-proofs.json >/dev/null
          python3 -m json.tool site/releases.json >/dev/null
          if find site \( -type l -o -type f -links +1 \) -print -quit | grep -q .; then
            echo 'The Pages artifact must not contain symbolic or hard links.' >&2
            exit 1
          fi
      - name: Stage component catalog for Pages
        run: |
          set -euo pipefail
          test -f components/catalog.json
          test ! -L components/catalog.json
          mkdir -p site/components
          cp components/catalog.json site/components/catalog.json
          python3 -m json.tool site/components/catalog.json >/dev/null
          test ! -L site/components/catalog.json
      - name: Test Pages UI and policy
        run: |
          set -euo pipefail
          node tests/test_pages_ui.js
          bash tests/test_pages_policy.sh
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
