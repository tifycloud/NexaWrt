name: NexaWrt custom component build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        type: choice
        options:
          - x86_64
          - xiaomi_ax9000
      flavor:
        description: Build flavor (nss is valid only for xiaomi_ax9000)
        required: true
        type: choice
        default: official
        options:
          - official
          - nss
      components:
        description: Comma-separated component IDs from components/catalog.json
        required: false
        type: string
        default: ''
      catalog_version:
        description: Exact catalog version displayed by the NexaWrt selector
        required: true
        type: string
      request_hash:
        description: Exact SHA256 request hash displayed by the NexaWrt selector
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build ${{ inputs.target }} / ${{ inputs.flavor }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      REQUESTED_TARGET: ${{ inputs.target }}
      REQUESTED_FLAVOR: ${{ inputs.flavor }}
      REQUESTED_COMPONENTS: ${{ inputs.components }}
      REQUESTED_CATALOG_VERSION: ${{ inputs.catalog_version }}
      REQUESTED_REQUEST_HASH: ${{ inputs.request_hash }}
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enforce workflow and request policy
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tifycloud/NexaWrt'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_WORKFLOW_REF" = 'tifycloud/NexaWrt/.github/workflows/custom-build.yml@refs/heads/main'
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          case "$REQUESTED_TARGET" in x86_64|xiaomi_ax9000) ;; *) exit 2 ;; esac
          case "$REQUESTED_FLAVOR" in official|nss) ;; *) exit 2 ;; esac
          if [[ "$REQUESTED_FLAVOR" = nss && "$REQUESTED_TARGET" != xiaomi_ax9000 ]]; then
            exit 2
          fi
          [[ ${#REQUESTED_COMPONENTS} -le 1024 ]]
          if [[ -n "$REQUESTED_COMPONENTS" ]]; then
            [[ "$REQUESTED_COMPONENTS" =~ ^[a-z0-9][a-z0-9_-]{0,63}(,[a-z0-9][a-z0-9_-]{0,63})*$ ]]
          fi
          [[ "$REQUESTED_CATALOG_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]
          [[ "$REQUESTED_REQUEST_HASH" =~ ^[0-9a-f]{64}$ ]]

      - name: Install pinned build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools python3-packaging rsync swig unzip zlib1g-dev \
            file wget curl libelf-dev shellcheck subversion time xsltproc zstd

      - name: Resolve catalog request and build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/custom-build.sh \
            "$REQUESTED_TARGET" \
            "$REQUESTED_FLAVOR" \
            "$REQUESTED_COMPONENTS" \
            "$REQUESTED_CATALOG_VERSION" \
            "$REQUESTED_REQUEST_HASH"

      - name: Audit custom build artifact before upload
        shell: bash
        env:
          BUILT_ARTIFACT_DIR: ${{ steps.build.outputs.artifact_dir }}
          BUILT_MANIFEST: ${{ steps.build.outputs.manifest }}
          BUILT_REQUEST_HASH: ${{ steps.build.outputs.request_hash }}
        run: |
          set -euo pipefail
          test -n "$BUILT_ARTIFACT_DIR"
          test -n "$BUILT_MANIFEST"
          test "$BUILT_REQUEST_HASH" = "$REQUESTED_REQUEST_HASH"
          test -f "$BUILT_MANIFEST"
          test ! -L "$BUILT_MANIFEST"
          test -s "$BUILT_MANIFEST"
          test -f "$BUILT_ARTIFACT_DIR/SHA256SUMS"
          test ! -L "$BUILT_ARTIFACT_DIR/SHA256SUMS"
          test -s "$BUILT_ARTIFACT_DIR/SHA256SUMS"
          python3 ./scripts/custom-artifacts.py audit \
            --artifact-dir "$BUILT_ARTIFACT_DIR" \
            --manifest "$BUILT_MANIFEST" \
            --expected-commit "$GITHUB_SHA" \
            --expected-target "$REQUESTED_TARGET" \
            --expected-flavor "$REQUESTED_FLAVOR" \
            --expected-request-hash "$BUILT_REQUEST_HASH"
          (cd "$BUILT_ARTIFACT_DIR" && sha256sum --check --strict SHA256SUMS)

      - name: Upload custom build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: true
