name: NexaWrt AX9000 initramfs release

on:
  push:
    tags:
      - 'ram-test-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run repository safety checks
        run: ./tests/test_static.sh

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools python3-packaging rsync swig unzip zlib1g-dev \
            file wget libelf-dev subversion time xsltproc zstd

      - name: Build release candidate
        run: ./scripts/build.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --notes "NexaWrt AX9000 single-large-UBI-v1 initramfs RAM-boot candidate. This is not a flash image; backups, UART, bootloader visibility, and recovery testing remain mandatory."
