name: NexaWrt signed APK package repository

on:
  pull_request:
    paths:
      - 'configs/ax9000-single-ubi*.config'
      - 'manifests/package-repository*'
      - 'packages/nexawrt-repository/**'
      - 'scripts/lock-file-policy.sh'
      - 'scripts/package-repository-key.sh'
      - 'scripts/prepare.sh'
      - 'scripts/stage-package-repository.py'
      - 'scripts/validate.sh'
      - 'tests/test_package_repository*'
      - '.github/workflows/package-repository.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'configs/ax9000-single-ubi*.config'
      - 'manifests/package-repository*'
      - 'packages/nexawrt-repository/**'
      - 'scripts/lock-file-policy.sh'
      - 'scripts/package-repository-key.sh'
      - 'scripts/prepare.sh'
      - 'scripts/stage-package-repository.py'
      - 'scripts/validate.sh'
      - 'tests/test_package_repository*'
      - '.github/workflows/package-repository.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: package-repository-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  policy:
    name: Validate repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install policy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl shellcheck
      - name: Validate signed APK repository policy
        run: |
          set -euo pipefail
          shellcheck -S warning \
            scripts/lock-file-policy.sh \
            scripts/package-repository-key.sh \
            scripts/prepare.sh \
            scripts/validate.sh \
            tests/test_package_repository_policy.sh
          bash tests/test_package_repository_policy.sh
          NEXAWRT_FLAVOR=official ./scripts/validate.sh
          NEXAWRT_FLAVOR=nss ./scripts/validate.sh

  publish:
    name: Build, sign, and publish testing repository
    needs: policy
    if: >-
      github.repository == 'tifycloud/NexaWrt' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: package-repository
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      WORK_DIR: .work/package-repository
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject mutable or duplicate repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/lock-file-policy.sh
          nexawrt_validate_lock_file manifests/package-repository.lock package-repository
          source manifests/package-repository.lock
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$NEXAWRT_REPOSITORY_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Repository release tag already exists; increment NEXAWRT_REPOSITORY_RELEASE instead of overwriting it." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$NEXAWRT_REPOSITORY_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Repository release already exists; immutable assets will not be replaced." >&2
            exit 1
          fi
      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools python3-packaging rsync swig unzip zlib1g-dev \
            file wget libelf-dev shellcheck subversion time xsltproc zstd
      - name: Prepare pinned OpenWrt source and feeds
        run: |
          set -euo pipefail
          NEXAWRT_FLAVOR=official WORK_DIR="$WORK_DIR" ./scripts/prepare.sh --clean
          NEXAWRT_FLAVOR=official ./scripts/validate.sh --source "$WORK_DIR"
      - name: Build the locked APK package set without a private key
        run: |
          set -euo pipefail
          public_key="$GITHUB_WORKSPACE/manifests/package-repository-public.pem"
          make -C "$WORK_DIR" -j"$(nproc)" V=s \
            NEXAWRT_APK_PUBLIC_ONLY=1 \
            BUILD_KEY_APK_PUB="$public_key" \
            package/nexawrt-repository/compile
          mkdir -p release-staging/package-input
          while IFS= read -r package; do
            [[ -n "$package" && "${package:0:1}" != '#' ]] || continue
            mapfile -t matches < <(find "$WORK_DIR/bin/packages" -type f -name "${package}-*.apk" -print | LC_ALL=C sort)
            ((${#matches[@]} == 1)) || {
              printf 'Expected exactly one APK for %s, found %s\n' "$package" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            }
            install -m 0644 "${matches[0]}" release-staging/package-input/
          done < manifests/package-repository-packages.txt
          find release-staging/package-input -type f -name '*.apk' -print -quit | grep -q .
          if find release-staging/package-input \( -type l -o -type f -links +1 \) -print -quit | grep -q .; then
            echo 'Package input contains a symbolic or hard link.' >&2
            exit 1
          fi
          test -x "$WORK_DIR/staging_dir/host/bin/apk"
      - name: Materialize and validate signing key
        id: signing_key
        env:
          REPOSITORY_PRIVATE_KEY: ${{ secrets.NEXAWRT_REPOSITORY_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/nexawrt-repository-signing.pem"
          test -n "$REPOSITORY_PRIVATE_KEY"
          printf '%s\n' "$REPOSITORY_PRIVATE_KEY" > "$key"
          chmod 0600 "$key"
          ./scripts/package-repository-key.sh private "$key"
          printf 'path=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - name: Build and verify signed repository archive
        env:
          PRIVATE_KEY_PATH: ${{ steps.signing_key.outputs.path }}
        run: |
          set -euo pipefail
          source scripts/lock-file-policy.sh
          nexawrt_validate_lock_file manifests/package-repository.lock package-repository
          source manifests/package-repository.lock
          mkdir -p release-staging/repository-parent release-staging/assets
          python3 scripts/stage-package-repository.py build \
            --input-dir release-staging/package-input \
            --output-dir release-staging/repository-parent/repository \
            --archive "release-staging/assets/$NEXAWRT_REPOSITORY_ASSET" \
            --private-key "$PRIVATE_KEY_PATH" \
            --public-key "$GITHUB_WORKSPACE/manifests/package-repository-public.pem" \
            --apk-executable "$WORK_DIR/staging_dir/host/bin/apk"
          archive="release-staging/assets/$NEXAWRT_REPOSITORY_ASSET"
          (cd release-staging/assets && sha256sum "$NEXAWRT_REPOSITORY_ASSET" > "$NEXAWRT_REPOSITORY_ASSET.sha256")
          "$WORK_DIR/staging_dir/host/bin/apk" adbdump --format json \
            release-staging/repository-parent/repository/packages.adb >/dev/null
          test -s "$archive"
      - name: Destroy signing key
        if: always()
        env:
          PRIVATE_KEY_PATH: ${{ steps.signing_key.outputs.path }}
        run: |
          set -euo pipefail
          if [[ -n "${PRIVATE_KEY_PATH:-}" && -f "$PRIVATE_KEY_PATH" && ! -L "$PRIVATE_KEY_PATH" ]]; then
            chmod 0600 "$PRIVATE_KEY_PATH"
            rm -f -- "$PRIVATE_KEY_PATH"
          fi
      - name: Upload signed repository workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-apk-repository-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-staging/assets/
          if-no-files-found: error
          retention-days: 30
      - name: Attest signed repository archive
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release-staging/assets/*.tar.gz
      - name: Publish immutable prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/lock-file-policy.sh
          nexawrt_validate_lock_file manifests/package-repository.lock package-repository
          source manifests/package-repository.lock
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$NEXAWRT_REPOSITORY_RELEASE_TAG" \
            -f sha="$GITHUB_SHA" >/dev/null
          cat > "$RUNNER_TEMP/package-repository-notes.md" <<NOTES
          NexaWrt signed APK testing repository ${NEXAWRT_REPOSITORY_RELEASE}.

          Repository index: ${NEXAWRT_REPOSITORY_INDEX_URL}
          Architecture: ${NEXAWRT_REPOSITORY_ARCH}
          Channel: ${NEXAWRT_REPOSITORY_CHANNEL}

          This is an APK repository for OpenWrt 25.12, not an OPKG/IPK feed.
          NOTES
          gh release create "$NEXAWRT_REPOSITORY_RELEASE_TAG" \
            --verify-tag --prerelease --latest=false \
            --title "NexaWrt APK repository $NEXAWRT_REPOSITORY_RELEASE" \
            --notes-file "$RUNNER_TEMP/package-repository-notes.md" \
            "release-staging/assets/$NEXAWRT_REPOSITORY_ASSET" \
            "release-staging/assets/$NEXAWRT_REPOSITORY_ASSET.sha256"
